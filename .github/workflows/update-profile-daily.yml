name: Update profile cards (Daily)

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Fetch GitHub profile data (Daily)
        env:
          GITHUB_USERNAME: iamhimanshu108
          GITHUB_TOKEN: ${{ secrets.PROFILE_PAT }}
        run: python scripts/update_profile_cards.py --mode daily

      - name: Generate Streak Stats (includes private repos if PAT is set)
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: "user=iamhimanshu108&theme=tokyonight&hide_border=true"
          path: "assets/streak.svg"
          token: ${{ secrets.PROFILE_PAT }}

      - name: Commit refreshed cards
        run: |
          git add assets/github-activity.svg assets/streak.svg
          if git diff --cached --quiet; then
            echo "No profile card changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh daily profile cards [skip ci]"
            git push
          fi

