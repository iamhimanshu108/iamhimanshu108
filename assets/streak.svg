<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink'
    style='isolation: isolate' viewBox='0 0 495 195' width='495px' height='195px' direction='ltr' role="img">
    <style>
        @keyframes currstreak {
            0% { font-size: 3px; opacity: 0.2; }
            80% { font-size: 34px; opacity: 1; }
            100% { font-size: 28px; opacity: 1; }
        }
        @keyframes fadein {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
    <defs>
        <clipPath id='outer_rectangle'>
            <rect width='495' height='195' rx='12'/>
        </clipPath>
        <mask id='mask_out_ring_behind_fire'>
            <rect width='495' height='195' fill='white'/>
            <!-- Original cy was 32. Since we translate by 14, cy becomes 46 -->
            <ellipse id='mask-ellipse' cx='247.5' cy='46' rx='13' ry='18' fill='black'/>
        </mask>
        <linearGradient id="kaliBorder" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.85"/>
            <stop offset="50%" stop-color="#1e40af" stop-opacity="0.5"/>
            <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.85"/>
        </linearGradient>
        <linearGradient id="kaliHeader" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0f192c"/>
            <stop offset="100%" stop-color="#090e18"/>
        </linearGradient>
    </defs>
    
    <rect width='495' height='195' rx='12' fill='#070c16'/>
    
    <g clip-path='url(#outer_rectangle)'>
        <rect width="495" height="36" fill="url(#kaliHeader)"/>
        <line x1="0" y1="36" x2="495" y2="36" stroke="#1e2d4a" stroke-width="1"/>
    </g>
    
    <circle cx="20" cy="18" r="5.5" fill="#ff5555"/>
    <circle cx="38" cy="18" r="5.5" fill="#ffb86c"/>
    <circle cx="56" cy="18" r="5.5" fill="#50fa7b"/>
    <text x="247.5" y="22" text-anchor="middle" fill="#64748b" font-family="Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="11" font-weight="bold">kali@iamhimanshu: ~/streak</text>
    
    <rect x="1" y="1" width="493" height="193" rx="11" fill="none" stroke="url(#kaliBorder)" stroke-width="1.5"/>
    
    <g transform="translate(0, 14)">
        <g style='isolation: isolate'>
            <line x1='165' y1='32' x2='165' y2='165' vector-effect='non-scaling-stroke' stroke-width='1.5' stroke='#1c2c48' stroke-dasharray='4 3'/>
            <line x1='330' y1='32' x2='330' y2='165' vector-effect='non-scaling-stroke' stroke-width='1.5' stroke='#1c2c48' stroke-dasharray='4 3'/>
        </g>
        
        <g style='isolation: isolate'>
            <!-- Total Contributions big number -->
            <g transform='translate(82.5, 48)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#00f0ff' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='700' font-size='28px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>
                    511
                </text>
            </g>
            <!-- Total Contributions label -->
            <g transform='translate(82.5, 84)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#38bdf8' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='700' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.7s'>
                    Total Contributions
                </text>
            </g>
            <!-- Total Contributions range -->
            <g transform='translate(82.5, 114)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#94a3b8' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='400' font-size='10px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.8s'>
                    Aug 5, 2022 - Present
                </text>
            </g>
        </g>
        <g style='isolation: isolate'>
            <!-- Current Streak label -->
            <g transform='translate(247.5, 108)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#ffb86c' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='700' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>
                    Current Streak
                </text>
            </g>
            <!-- Current Streak range -->
            <g transform='translate(247.5, 145)'>
                <text x='0' y='21' stroke-width='0' text-anchor='middle' fill='#94a3b8' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='400' font-size='10px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 0.9s'>
                    Aug 25 - Sep 11
                </text>
            </g>
            <!-- Ring around number -->
            <g mask='url(#mask_out_ring_behind_fire)'>
                <circle cx='247.5' cy='71' r='40' fill='none' stroke='#ffb86c' stroke-width='3' style='opacity: 0; animation: fadein 0.5s linear forwards 0.4s'></circle>
            </g>
            <!-- Fire icon -->
            <g transform='translate(247.5, 19.5)' stroke-opacity='0' style='opacity: 0; animation: fadein 0.5s linear forwards 0.6s'>
                <path d='M -12 -0.5 L 15 -0.5 L 15 23.5 L -12 23.5 L -12 -0.5 Z' fill='none'/>
                <path d='M 1.5 0.67 C 1.5 0.67 2.24 3.32 2.24 5.47 C 2.24 7.53 0.89 9.2 -1.17 9.2 C -3.23 9.2 -4.79 7.53 -4.79 5.47 L -4.76 5.11 C -6.78 7.51 -8 10.62 -8 13.99 C -8 18.41 -4.42 22 0 22 C 4.42 22 8 18.41 8 13.99 C 8 8.6 5.41 3.79 1.5 0.67 Z M -0.29 19 C -2.07 19 -3.51 17.6 -3.51 15.86 C -3.51 14.24 -2.46 13.1 -0.7 12.74 C 1.07 12.38 2.9 11.53 3.92 10.16 C 4.31 11.45 4.51 12.81 4.51 14.2 C 4.51 16.85 2.36 19 -0.29 19 Z' fill='#ff5555' stroke-opacity='0'/>
            </g>
            <!-- Current Streak big number -->
            <g transform='translate(247.5, 48)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#ffb86c' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='700' font-size='28px' font-style='normal' style='animation: currstreak 0.6s linear forwards'>
                    18
                </text>
            </g>
        </g>
        <g style='isolation: isolate'>
            <!-- Longest Streak big number -->
            <g transform='translate(412.5, 48)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#50fa7b' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='700' font-size='28px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.2s'>
                    21
                </text>
            </g>
            <!-- Longest Streak label -->
            <g transform='translate(412.5, 84)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#38bdf8' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='700' font-size='12px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.3s'>
                    Longest Streak
                </text>
            </g>
            <!-- Longest Streak range -->
            <g transform='translate(412.5, 114)'>
                <text x='0' y='32' stroke-width='0' text-anchor='middle' fill='#94a3b8' stroke='none' font-family='Fira Code, Menlo, Monaco, Consolas, Liberation Mono, monospace' font-weight='400' font-size='10px' font-style='normal' style='opacity: 0; animation: fadein 0.5s linear forwards 1.4s'>
                    May 31 - Jun 20
                </text>
            </g>
        </g>
    </g>
</svg>
