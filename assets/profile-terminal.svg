<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Himanshu Kumar Yadav terminal profile</title>
  <desc id="desc">A dark terminal styled profile card for full-stack developer Himanshu Kumar Yadav.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="border" x1="0" x2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.55" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <clipPath id="avatarClip"><circle cx="252" cy="290" r="112"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="510" rx="18" fill="#080d17"/>
  <rect x="10" y="10" width="1180" height="490" rx="14" fill="url(#panel)" stroke="url(#border)" stroke-width="2"/>
