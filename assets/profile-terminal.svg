      @keyframes blink { 50% { opacity: 0; } } @keyframes float { 50% { transform: translateY(-6px); } } @keyframes pulse { 50% { opacity: .35; transform: scale(1.055); } } @keyframes scan { 0% { transform: translateY(-125px); opacity: 0; } 15%,85% { opacity: .55; } 100% { transform: translateY(125px); opacity: 0; } }
    </style>
